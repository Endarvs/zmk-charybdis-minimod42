manifest:
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    - name: 280Zo
      url-base: https://github.com/280Zo
    - name: oleksandrmaslov
      url-base: https://github.com/oleksandrmaslov

  projects:
    - name: zmk
      remote: zmkfirmware
      revision: main
      import: app/west.yml

    # Улучшенный драйвер сенсора трекбола PixArt PMW3610 для ZMK main (Zephyr 4.1):
    # поддерживает split-peripheral передачу (zmk,input-split), сглаживание частоты
    # опроса и подавление паразитного рывка курсора при пробуждении из сна.
    - name: zmk-pmw3610-driver
      remote: 280Zo
      revision: main

    # Аппаратный модуль динамической акселерации указателя (квадратичная кривая):
    # обеспечивает 0.4x скорость при медленном вращении (попиксельная точность)
    # и 3.5x скорость при быстром броске без изменения настроек мыши Windows.
    - name: zmk-pointing-acceleration
      remote: oleksandrmaslov
      revision: main

    # Опционально: раскомментируйте для сборки донгла с цветным экраном Prospector (ST7789V2)
    # - name: prospector-zmk-module
    #   remote: 280Zo
    #   revision: main

  self:
    path: config
