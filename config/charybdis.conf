# =============================================================================
# Общие пользовательские настройки Charybdis Mini MOD (42 клавиши, V&Z-MINI36M)
# Применяются ко всем вариантам сборки (BT/USB режим и режим с USB-донглом).
# =============================================================================

# Увеличенная мощность радиопередатчика (+8 dBm) для уверенной связи между половинами и донглом
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Стабильность и пропускная способность BLE L2CAP/ACL (2M PHY активен, без EXPERIMENTAL_CONN):
# критично для плотного потока пакетов трекбола PMW3610 и одновременной работы двух половин с донглом
CONFIG_ZMK_BLE=y
CONFIG_BT_BUF_ACL_TX_COUNT=12
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_BUF_ACL_RX_SIZE=255
CONFIG_BT_L2CAP_TX_MTU=247

# Локальный отчёт о заряде батареи (без централизованного опроса периферии из-за бага ZMK #3156)
CONFIG_ZMK_BATTERY_REPORTING=y

# Увеличенная очередь макросов и поведений
CONFIG_ZMK_BEHAVIORS_QUEUE_SIZE=512
