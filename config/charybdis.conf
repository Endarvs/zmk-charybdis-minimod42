# =============================================================================
# Общие пользовательские настройки Charybdis Mini MOD (42 клавиши, V&Z-MINI36M)
# Применяются ко всем вариантам сборки (BT/USB режим и режим с USB-донглом).
# =============================================================================

# Увеличенная мощность радиопередатчика (+8 dBm) для стабильной связи между половинами и донглом
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Bluetooth и улучшенные параметры стабильности BLE-соединения (Windows / macOS / iOS / Android)
CONFIG_ZMK_BLE=y
CONFIG_ZMK_BLE_EXPERIMENTAL_FEATURES=y

# Отображение заряда батареи
CONFIG_ZMK_BATTERY_REPORTING=y

# Увеличенная очередь макросов и лимиты комбо
CONFIG_ZMK_BEHAVIORS_QUEUE_SIZE=512
CONFIG_ZMK_COMBO_MAX_COMBOS_PER_KEY=8
CONFIG_ZMK_COMBO_MAX_KEYS_PER_COMBO=4
