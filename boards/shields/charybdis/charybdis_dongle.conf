# Центральный USB/BLE Донгл (принимает 2 периферии: левую и правую половины)
CONFIG_ZMK_SPLIT=y
CONFIG_ZMK_SPLIT_ROLE_CENTRAL=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS=2
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y

# Донгл питается от USB постоянно — отключаем глубокий сон, чтобы половины мгновенно просыпались
CONFIG_ZMK_SLEEP=n

# ZMK Studio на донгле (настройка раскладки прямо через USB-кабель донгла на https://zmk.studio/)
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=y
CONFIG_ZMK_STUDIO_LOCK_ON_DISCONNECT=y
CONFIG_ZMK_STUDIO_TRANSPORT_BLE_PREF_LATENCY=5

# Обработка указателя трекбола и плавная прокрутка (HID Resolution Multipliers)
CONFIG_INPUT=y
CONFIG_ZMK_POINTING=y
CONFIG_ZMK_POINTING_SMOOTH_SCROLLING=y
