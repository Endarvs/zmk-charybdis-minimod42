# Центральный USB/BLE Донгл (принимает 2 периферии: левую и правую половины)
CONFIG_ZMK_SPLIT=y
CONFIG_ZMK_SPLIT_ROLE_CENTRAL=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS=2
# ВАЖНО: CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING отключён из-за бага ZMK main (#3156 / #3411),
# где коллизия sub_discover_params обрывает GATT-подписку на нажатия левой половины и трекбол правой половины.

# Донгл питается от USB постоянно — отключаем глубокий сон, чтобы половины мгновенно откликались
CONFIG_ZMK_SLEEP=n
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096

# ZMK Studio на донгле: сразу открывает редактирование раскладки БЕЗ требования Unlock (как на заводской прошивке)
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n
CONFIG_ZMK_STUDIO_LOCK_ON_DISCONNECT=n
CONFIG_ZMK_STUDIO_TRANSPORT_BLE_PREF_LATENCY=5

# Максимальная мощность BLE (+8 dBm) только на USB-донгле (питается от ПК, нулевой расход батарей половин)
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
CONFIG_ZMK_BATTERY_REPORT_INTERVAL=60
CONFIG_RING_BUFFER=y
CONFIG_SETTINGS=y

# Обработка указателя трекбола и плавная прокрутка (HID Resolution Multipliers)
CONFIG_INPUT=y
CONFIG_ZMK_POINTING=y
CONFIG_ZMK_POINTING_SMOOTH_SCROLLING=y
