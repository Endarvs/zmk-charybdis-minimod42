# Правая половина Peripheral (для работы в паре с внешним USB-донглом)
CONFIG_ZMK_SPLIT_ROLE_CENTRAL=n
CONFIG_ZMK_USB=n

# Энергосбережение без глубокого отключения радиоканала (мгновенный отклик клавиш и трекбола)
CONFIG_ZMK_SLEEP=n
CONFIG_ZMK_IDLE_TIMEOUT=30000
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
# Мощность радиопередатчика 0 dBm (экономит батарею правой половины при непрерывном 83 Гц потоке трекбола)
CONFIG_ZMK_BATTERY_REPORT_INTERVAL=60

# Локальный драйвер сенсора PMW3610 + буфер очереди BLE-передачи движений на донгл
CONFIG_SPI=y
CONFIG_INPUT=y
CONFIG_ZMK_POINTING=y
CONFIG_ZMK_INPUT_SPLIT_MSG_QUEUE_SIZE=64
CONFIG_PMW3610_ALT=y
# Отключаем нестабильный SMART_ALGORITHM (запись в reg 0x32 при вибрациях срывала сенсор в бесконечный шторм прерываний)
CONFIG_PMW3610_ALT_SMART_ALGORITHM=n
CONFIG_PMW3610_ALT_REPORT_INTERVAL_MIN=12
CONFIG_PMW3610_ALT_REST1_SAMPLE_TIME_MS=100
CONFIG_PMW3610_ALT_REST2_SAMPLE_TIME_MS=200
CONFIG_PMW3610_ALT_REST3_SAMPLE_TIME_MS=300
CONFIG_PMW3610_ALT_RUN_DOWNSHIFT_TIME_MS=2000
CONFIG_PMW3610_ALT_REST1_DOWNSHIFT_TIME_MS=3000
CONFIG_PMW3610_ALT_REST2_DOWNSHIFT_TIME_MS=30000
# Задержка инициализации сенсора при холодном старте от аккумулятора (после включения тумблера питания)
CONFIG_PMW3610_ALT_INIT_POWER_UP_EXTRA_DELAY_MS=300

# Подсветка отключена (на плате физически нет светодиодов)
# Шина EXT_POWER (P0.13) включена для питания сенсора трекбола PMW3610
CONFIG_ZMK_EXT_POWER=y
CONFIG_ZMK_RGB_UNDERGLOW=n
