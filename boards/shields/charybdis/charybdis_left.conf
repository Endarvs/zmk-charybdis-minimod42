# Левая половина (Peripheral): работает от аккумулятора, передаёт нажатия по BLE на Central / донгл
CONFIG_ZMK_SPLIT_ROLE_CENTRAL=n
CONFIG_ZMK_USB=n

# Энергосбережение без глубокого отключения радиоканала (как в заводской прошивке: мгновенный отклик без отвала связи)
CONFIG_ZMK_SLEEP=n
CONFIG_ZMK_IDLE_TIMEOUT=30000
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

# Подсветка отключена (на плате физически нет светодиодов)
CONFIG_ZMK_RGB_UNDERGLOW=n
