# Левая половина (Peripheral): работает от аккумулятора, передаёт нажатия по BLE на Central / донгл
CONFIG_ZMK_SPLIT_ROLE_CENTRAL=n
CONFIG_ZMK_USB=n

# Энергосбережение без глубокого отключения радиоканала (как в заводской прошивке: мгновенный отклик без отвала связи)
CONFIG_ZMK_SLEEP=n
CONFIG_ZMK_IDLE_TIMEOUT=30000
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

# Подсветка WS2812 (21 LED): по умолчанию выключена при старте ради экономии заряда (включается клавишей RGB_TOG)
CONFIG_ZMK_EXT_POWER=y
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER=n
CONFIG_ZMK_RGB_UNDERGLOW_ON_START=n
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=y
CONFIG_ZMK_RGB_UNDERGLOW_BRT_MAX=70
